# 本地编译覆盖文件
# 用法：docker compose -f docker-compose.yml -f docker-compose.cross.yml up -d
#
# 使用场景：服务器内存不足（<2GB），在本地编译前后端产物后上传到服务器构建镜像。
#   - backend：使用 Dockerfile.run（仅运行，需先交叉编译二进制并上传）
#   - frontend：使用 Dockerfile.run（仅运行，需先 npm run build 并上传 dist/）
#
# 前置步骤：
#   后端：
#     1. 本地交叉编译：CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o elainablog ./cmd
#     2. 上传：scp backend/elainablog server:~/ElainaBlog/backend/
#            scp -r backend/config/db/SQLscript server:~/ElainaBlog/backend/config/db/
#   前端：
#     1. 本地构建：cd frontend && npm run build
#     2. 上传：scp -r frontend/dist server:~/ElainaBlog/frontend/
#            scp frontend/nginx.conf server:~/ElainaBlog/frontend/

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.run
    image: elainablog-frontend:latest

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.run
    image: elainablog-backend:latest
