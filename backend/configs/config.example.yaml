# 配置文件示例 — 复制为 config.dev.yaml（开发）或 config.prod.yaml（生产）后修改
# 开发与生产环境的关键差异已在注释中标出
# 敏感与部署相关配置（密码、地址等）也可用环境变量覆盖，变量名见 .env.example，优先级高于 yaml

auth:
  access_token_secret: "your-access-secret"    # 替换为随机密钥
  refresh_token_secret: "your-refresh-secret"  # 替换为随机密钥
  access_token_expiry_time: 2h
  refresh_token_expiry_time: 7d
  issuer: ElainaWeb

db:
  host: 127.0.0.1     # 生产环境改为 mysql（Docker 服务名）
  port: 3306
  username: root
  password: your-mysql-password  # 生产环境需与 docker-compose 中 MYSQL_ROOT_PASSWORD 一致
  db_name: ElainaBlog

smtp:
  host: "smtp.qq.com"
  port: 587
  from: "your_email@qq.com"
  verification: "your_authorization_code"
  ssl: true
  timeout: 300

redis:
  address: 127.0.0.1:6379  # 生产环境改为 redis:6379（Docker 服务名）
  password: ""
  db: 0
  pool_size: 100

verification:
  code_length: 6
  expire_time: 300
  resend_interval: 60

server:
  port: 9178

upload:
  size: 20
  path: uploads
  avatar_path: uploads/avatars
  avatar_size: 5
  # 上传频率限制
  rate_limit: 20            # 每小时最多上传图片数量
  rate_window: 3600         # 频率限制时间窗口（秒）
  # 孤儿图片清理
  cleanup_enabled: true     # 是否启用孤儿图片清理
  cleanup_cron: "0 3 * * *" # 清理任务 cron 表达式（每天凌晨3点）

admin:
  username: admin
  email: admin@admin.com
  password: ""            # 必填：启动时自动创建管理员，变更后重启重置密码
