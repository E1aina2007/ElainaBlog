# 本地构建覆盖文件
# 用法：docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# 此文件覆盖 frontend 和 backend 的 image 字段，改用 build 本地构建镜像。
# 其余配置（mysql、redis、volumes、networks 等）继承自 docker-compose.yml。

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: elainablog-frontend:latest

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: elainablog-backend:latest
