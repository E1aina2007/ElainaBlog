name: CI

# 推送 main/dev 或开 PR 时运行
on:
  push:
    branches: [main, dev]
  pull_request:

# 同一分支重复触发时取消旧运行
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限，只读仓库
permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本自动读取自 go.mod
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # 显式指定输出文件，避免与 cmd 目录重名
      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o /tmp/elainablog ./cmd

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 版本与 Dockerfile 保持一致
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 存量 lint 错误较多，暂只提示不阻断；修完后删除 continue-on-error
      - name: Lint (advisory)
        continue-on-error: true
        run: |
          npx oxlint .
          npx eslint .

      - name: Type check
        run: npm run type-check

      # 暂无单测文件，允许无测试通过
      - name: Unit tests
        run: npm run test:unit -- --run --passWithNoTests

      - name: Build
        run: npm run build-only
