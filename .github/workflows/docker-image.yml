name: Build and Push Docker Images

# 仅 main 推送时构建，也可手动触发
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 同一分支重复触发时取消旧运行
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

# 最小权限，只读仓库
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 前后端并行构建
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 密码建议使用访问令牌
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 一次构建，同时推送两个仓库
      - name: Build and push to both registries
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          # 关闭 OCI 证明信息，避免阿里云 ACR 拒绝推送（unknown manifest class）
          provenance: false
          sbom: false
          # 两个仓库各打 latest 与 commit 哈希标签
          tags: |
            ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/elainablog-${{ matrix.service }}:latest
            ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/elainablog-${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/elainablog-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/elainablog-${{ matrix.service }}:${{ github.sha }}
          # GitHub Actions 缓存加速构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
